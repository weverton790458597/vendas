<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2947E0">
    <meta name="description" content="Achei e Postei - Os melhores achados da internet, em um só lugar. Curadoria de ofertas e descontos da Shopee.">

    <meta property="og:title" content="Achei e Postei - Curadoria de Achados">
    <meta property="og:description" content="Os melhores achados da internet, em um só lugar! Ofertas em destaque com grandes descontos.">
    <meta property="og:image" content="assets/img/avatar.png">
    <meta property="og:type" content="website">

    <title>Achei e Postei - Curadoria de Achados</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <button class="icon-btn" id="menuBtn" aria-label="Abrir menu">
                <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>

            <img src="assets/img/logo.png" alt="Achei e Postei" class="logo" loading="eager">

            <button class="icon-btn" id="notifBtn" aria-label="Notificações">
                <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span class="notif-badge">3</span>
            </button>
        </div>
    </header>

    <main class="main-content">
        <!-- Barra de Busca -->
        <section class="search-section">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Buscar produtos, marcas, ofertas..." class="search-input" autocomplete="off">
                <button class="search-button" id="searchButton" aria-label="Buscar">
                    <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>
            </div>
        </section>

        <!-- Banner Hero -->
        <section class="hero-banner">
            <div class="hero-banner-inner">
                <div class="hero-text">
                    <h1>Os melhores achados da internet, <span class="accent">em um só lugar!</span></h1>
                </div>
                <div class="hero-illustration">
                    <svg viewBox="0 0 200 190" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <g opacity="0.9">
                            <path d="M148 30 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#FFFFFF"/>
                            <path d="M178 66 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#FF7A1A"/>
                            <path d="M100 22 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z" fill="#FFFFFF" opacity="0.8"/>
                        </g>
                        <path d="M20 60 L36 60 L48 130 L142 130" fill="none" stroke="#E9EDFB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="46" y="72" width="96" height="58" rx="6" fill="none" stroke="#E9EDFB" stroke-width="7"/>
                        <line x1="64" y1="72" x2="64" y2="130" stroke="#E9EDFB" stroke-width="6"/>
                        <line x1="124" y1="72" x2="124" y2="130" stroke="#E9EDFB" stroke-width="6"/>
                        <circle cx="62" cy="150" r="9" fill="none" stroke="#E9EDFB" stroke-width="7"/>
                        <circle cx="126" cy="150" r="9" fill="none" stroke="#E9EDFB" stroke-width="7"/>
                        <rect x="55" y="36" width="70" height="52" rx="4" fill="#FF9B4D"/>
                        <rect x="55" y="36" width="70" height="16" rx="4" fill="#FFB273"/>
                        <rect x="86" y="20" width="8" height="36" fill="#1B32AD"/>
                        <path d="M60 20 q30 -18 60 0" fill="none" stroke="#1B32AD" stroke-width="6" stroke-linecap="round"/>
                        <g>
                            <rect x="140" y="98" width="34" height="30" rx="5" fill="#FF7A1A"/>
                            <circle cx="150" cy="113" r="3" fill="#FFFFFF"/>
                            <path d="M150 106 L150 113 L156 118" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                        </g>
                    </svg>
                </div>
            </div>
        </section>

        <!-- Categorias -->
        <nav class="categories-row" id="categoriesRow" aria-label="Categorias"></nav>

        <!-- Ofertas em destaque -->
        <section class="section offers-section" id="featuredProducts">
            <div class="section-header">
                <h2 class="section-title">Ofertas em destaque</h2>
                <a href="loja.html" class="see-all-link">
                    Ver todas
                    <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </a>
            </div>
            <div class="products-grid" id="featuredProductsGrid"></div>
        </section>

        <section class="section trust-section">
            <div class="trust-badge">
                <span class="trust-stars"></span>
                <span class="trust-rating">4.9</span> / 5.0
            </div>
            <p class="trust-text">milhares de achados curadoria validada</p>
        </section>
    </main>

    <footer class="footer">
        <p class="footer-text">© 2025 Achei e Postei • Seu bolso agradece</p>
        <p class="footer-subtext">Links de afiliado • Compre na Shopee e aproveite</p>
    </footer>

    <nav class="bottom-nav" aria-label="Navegação principal">
        <a href="index.html" class="nav-item active">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span>Início</span>
        </a>
        <a href="loja.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            <span>Categorias</span>
        </a>
        <a href="#" class="nav-item" id="navFavoritos">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
            <span>Favoritos</span>
        </a>
        <a href="loja.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 12.3 12.7 20.2a2 2 0 0 1-2.8 0l-6-6a2 2 0 0 1 0-2.9L11.7 3.4a2 2 0 0 1 1.5-.6l6.2.2a1.8 1.8 0 0 1 1.7 1.7l.2 6.2a2 2 0 0 1-.7 1.4z"/><circle cx="15.5" cy="8.5" r="1.5"/></svg>
            <span>Ofertas</span>
        </a>
        <a href="#" class="nav-item" id="navPerfil">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Perfil</span>
        </a>
    </nav>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
