<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Achei &amp; Postei — Quero conhecer</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="parceiros.css" />
<script>
  (function () { try { var t = localStorage.getItem('ap-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
</head>
<body>
<section class="pt-auth">
  <div class="pt-card">
    <div class="pt-brand">🚀 Achei &amp; Postei</div>
    <h1 style="font-size:1.4rem">Cada comentário vira uma venda no automático</h1>
    <p>Deixe seus dados e nossa equipe libera o seu acesso para você começar.</p>
    <div id="inBanner" class="banner"></div>
    <div id="inForm">
      <div class="field"><label for="inNome">Seu nome</label><input id="inNome" autocomplete="name" /></div>
      <div class="field"><label for="inEmail">E-mail</label><input type="email" id="inEmail" autocomplete="email" /></div>
      <div class="field"><label for="inWhats">WhatsApp</label><input id="inWhats" inputmode="tel" autocomplete="tel" /></div>
      <button type="button" id="inBtn" class="btn btn-primary btn-full">Quero meu acesso</button>
    </div>
  </div>
</section>
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
  const sb = createClient("https://abdliioyzkylccfylils.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFiZGxpaW95emt5bGNjZnlsaWxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgwNzkxMzIsImV4cCI6MjA4MzY1NTEzMn0.5s0zEdAgxx92pbC9yx75hHMfysHr2Aad86GhC1-tEmU",
    { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
  const $ = (id) => document.getElementById(id);
  const ref = new URLSearchParams(location.search).get("ref") || "";
  const MSG = {
    email_invalido: ["Confira o e-mail digitado.", "error"],
    codigo_invalido: ["Este link de indicação não está ativo.", "error"],
    ja_cliente: ["Você já tem cadastro! Entre pelo painel normalmente.", "success"],
    ja_indicado: ["Recebemos seu pedido antes. Em breve você recebe o convite por e-mail.", "success"],
    ok: ["Pronto! Você vai receber o convite de acesso no seu e-mail.", "success"],
  };
  $("inBtn").addEventListener("click", async () => {
    const b = $("inBanner");
    $("inBtn").disabled = true;
    const { data, error } = await sb.rpc("registrar_indicacao", {
      p_codigo: ref, p_email: $("inEmail").value, p_nome: $("inNome").value, p_whatsapp: $("inWhats").value,
    });
    $("inBtn").disabled = false;
    const [text, type] = error ? ["Não foi possível enviar agora. Tente novamente.", "error"] : (MSG[data] || MSG.codigo_invalido);
    b.textContent = text; b.className = "banner " + type;
    if (!error && (data === "ok" || data === "ja_indicado")) $("inForm").classList.add("hidden");
  });
</script>
</body>
</html>
