<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e1306c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c13583;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="90" fill="url(#grad)" />
  <!-- Instagram-style camera icon (simplified) -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="white" stroke-width="8" />
  <circle cx="256" cy="256" r="60" fill="white" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="white" stroke-width="8" stroke-dasharray="8 16" />
  <!-- Camera lens -->
  <circle cx="256" cy="256" r="30" fill="url(#grad)" />
  <!-- Flash -->
  <rect x="242" y="210" width="28" height="40" rx="6" fill="white" />
  <!-- Film holes -->
  <circle cx="156" cy="256" r="24" fill="white" />
  <circle cx="356" cy="256" r="24" fill="white" />
</svg>