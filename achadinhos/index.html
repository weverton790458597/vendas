<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2947E0">

    <!-- SEO básico -->
    <title>Loja Completa | Achei e Postei - Todos os Achados por Categoria</title>
    <meta name="description" content="Loja completa do Achei e Postei: todos os achados por categoria, com filtro e busca. Produtos com desconto real da Shopee e Mercado Livre.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://acheiepostei.shop/achadinhos/">

    <!-- Open Graph -->
    <meta property="og:site_name" content="Achei e Postei">
    <meta property="og:title" content="Loja Completa - Achei e Postei">
    <meta property="og:description" content="Catálogo completo de achados com curadoria. Busque e filtre por categoria!">
    <meta property="og:image" content="https://acheiepostei.shop/assets/img/avatar.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://acheiepostei.shop/achadinhos/">
    <meta property="og:locale" content="pt_BR">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Loja Completa - Achei e Postei">
    <meta name="twitter:description" content="Catálogo completo de achados com curadoria. Busque e filtre por categoria!">
    <meta name="twitter:image" content="https://acheiepostei.shop/assets/img/avatar.png">

    <!-- Favicon -->
    <link rel="icon" href="/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="loja.css">

    <!-- Dados estruturados (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Início",
              "item": "https://acheiepostei.shop/"
            },
            {
              "@type": "ListItem",
              "position": 2,
              "name": "Loja Completa",
              "item": "https://acheiepostei.shop/achadinhos/"
            }
          ]
        },
        {
          "@type": "CollectionPage",
          "name": "Loja Completa - Achei e Postei",
          "url": "https://acheiepostei.shop/achadinhos/",
          "description": "Catálogo completo de achados com curadoria, filtrável por categoria.",
          "isPartOf": { "@id": "https://acheiepostei.shop/#website" }
        }
      ]
    }
    </script>
</head>
<body>
    <header class="header">
        <div class="header-content loja-header-content">
            <a href="../" class="icon-btn" aria-label="Voltar para a página inicial">
                <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
            </a>
            <img src="../logo.png" alt="Achei e Postei" class="logo" loading="eager">
            <h1 class="loja-title">Loja Completa</h1>
        </div>
    </header>

    <main class="main-content">
        <section class="search-section">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Buscar achado específico..." class="search-input" autocomplete="off">
                <button class="search-button" id="searchButton" aria-label="Buscar">
                    <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>
            </div>
        </section>

        <section class="filters-section">
            <div class="filters-container" id="categoryFilters"></div>
        </section>

        <section class="section">
            <div class="products-grid loja-grid" id="productsGrid"></div>
        </section>
    </main>

    <footer class="footer">
        <p class="footer-text">© 2025 Achei e Postei • Curadoria de Achados</p>
        <p class="footer-subtext">Compre na Shopee e aproveite cada centavo</p>
    </footer>

    <nav class="bottom-nav" aria-label="Navegação principal">
        <a href="../" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span>Início</span>
        </a>
        <a href="./" class="nav-item active">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            <span>Categorias</span>
        </a>
        <a href="./" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 12.3 12.7 20.2a2 2 0 0 1-2.8 0l-6-6a2 2 0 0 1 0-2.9L11.7 3.4a2 2 0 0 1 1.5-.6l6.2.2a1.8 1.8 0 0 1 1.7 1.7l.2 6.2a2 2 0 0 1-.7 1.4z"/><circle cx="15.5" cy="8.5" r="1.5"/></svg>
            <span>Ofertas</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="loja.js"></script>
</body>
</html>
